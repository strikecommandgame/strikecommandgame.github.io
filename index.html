<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike Command</title>
<meta name="description" content="Strike Command: an isometric attack-helicopter action game for Android.">
<style>
  :root { --bg: #171a17; --fg: #ece9e1; --muted: #a9ada3; --accent: #e8a33d; --card: #1f221e; --line: #33372f; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; text-align: center; }
  img.banner { width: 100%; max-width: 760px; border-radius: 10px; border: 1px solid var(--line); }
  img.icon { width: 96px; height: 96px; border-radius: 20px; margin-top: -48px; border: 3px solid var(--bg); }
  h1 { margin: 8px 0 4px; font-size: 2rem; color: var(--accent); letter-spacing: 0.02em; }
  p { color: var(--muted); }
  .links a { display: inline-block; margin: 8px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 8px; color: var(--fg); text-decoration: none; background: var(--card); }
  .links a:hover { border-color: var(--accent); }
  footer { margin-top: 40px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="banner" src="banner.png" alt="Strike Command attack helicopters over a burning desert">
  <img class="icon" src="icon.png" alt="Strike Command icon">
  <h1>Strike Command</h1>
  <p>Fly an attack helicopter through explosive campaign missions and endless Survivor swarms.</p>
  <div class="links">
    <a href="privacy/">Privacy policy</a>
    <a href="mailto:anwar.alfazaa@gmail.com">Contact</a>
  </div>
  <footer>&copy; 2026 Strike Command</footer>
</main>
</body>
</html>
